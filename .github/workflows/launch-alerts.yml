name: Launch alerts

on:
  schedule:
    # Every 15 minutes (offset from :00 because GitHub is busiest on the hour)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert (no role pings)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: launch-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check launches and post alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LL2_API_KEY: ${{ secrets.LL2_API_KEY }}
          TEST_ALERT: ${{ github.event.inputs.test }}
        run: python launch_alerts.py

      - name: Save which alerts were sent
        run: |
          if [ -n "$(git status --porcelain alerts_state.json)" ]; then
            git config user.name "rocket-tracker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts_state.json
            git commit -m "Update sent alerts"
            git push
          fi
